# ===================================================
# Database (env vars override the local defaults)
# ===================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/airport_staff_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:jebi}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===================================================
# Server
# ===================================================
server.port=${PORT:8080}

# ===================================================
# JWT
# ===================================================
jwt.secret=${JWT_SECRET:airportGroundStaffTaskManagementSecretKey2026MustBeAtLeast32Chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===================================================
# Email (real notification delivery via Gmail SMTP)
# ===================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:youraddress@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:your16charapppassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Turn real email sending on/off without touching code
app.notification.email-enabled=${EMAIL_ENABLED:true}

# ===================================================
# CORS - comma separated list of allowed frontend URLs
# ===================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
